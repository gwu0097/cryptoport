<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoPort — Under Construction</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
      color: #e6e8eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 480px; }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: #9aa3af;
      font-size: 1.05rem;
      margin: 0;
    }
    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #1a1d24;
      border: 1px solid #2a2e37;
      color: #ffb020;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Under Construction</div>
    <h1>CryptoPort</h1>
    <p>We're building something new. Check back soon.</p>
  </div>
</body>
</html>
